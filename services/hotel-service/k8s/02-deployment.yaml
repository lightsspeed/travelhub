apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
  namespace: travelhub-hotel
  labels:
    app: hotel-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-service
  template:
    metadata:
      labels:
        app: hotel-service
    spec:
      containers:
      - name: hotel-service
        image: travelhub/hotel-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8002
          initialDelaySeconds: 2
          periodSeconds: 5
