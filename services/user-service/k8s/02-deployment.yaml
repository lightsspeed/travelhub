apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: travelhub-user
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: travelhub/user-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 2
          periodSeconds: 5
