apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
  namespace: travelhub
  labels:
    app: travelhub
    component: backend
    service: hotel-service
    version: "1.0.5"
    managed-by: kubernetes
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: travelhub
      service: hotel-service
  template:
    metadata:
      labels:
        app: travelhub
        component: backend
        service: hotel-service
        version: "1.0.5"
        managed-by: kubernetes
    spec:
      containers:
      - name: hotel-service
        image: travelhub/hotel-service:1.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
        env:
        - name: PORT
          value: "8002"
