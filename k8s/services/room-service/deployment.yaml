apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-service
  namespace: travelhub
  labels:
    app: travelhub
    component: backend
    service: room-service
    version: "1.0.5"
    managed-by: kubernetes
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: travelhub
      service: room-service
  template:
    metadata:
      labels:
        app: travelhub
        component: backend
        service: room-service
        version: "1.0.5"
        managed-by: kubernetes
    spec:
      containers:
      - name: room-service
        image: travelhub/room-service:1.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8003
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        env:
        - name: PORT
          value: "8003"
        - name: HOTEL_SERVICE_URL
          value: "http://hotel-service.travelhub.svc.cluster.local:8002"

        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
