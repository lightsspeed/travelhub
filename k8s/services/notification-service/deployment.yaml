apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: travelhub
  labels:
    app: travelhub
    component: backend
    service: notification-service
    version: "1.0.5"
    managed-by: kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travelhub
      service: notification-service
  template:
    metadata:
      labels:
        app: travelhub
        component: backend
        service: notification-service
        version: "1.0.5"
        managed-by: kubernetes
    spec:
      containers:
      - name: notification-service
        image: travelhub/notification-service:1.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8009
        env:
        - name: PORT
          value: "8009"
