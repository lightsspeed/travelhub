apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: travelhub
  labels:
    app: travelhub
    component: backend
    service: booking-service
    version: "1.0.5"
    managed-by: kubernetes
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: travelhub
      service: booking-service
  template:
    metadata:
      labels:
        app: travelhub
        component: backend
        service: booking-service
        version: "1.0.5"
        managed-by: kubernetes
    spec:
      containers:
      - name: booking-service
        image: travelhub/booking-service:1.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8006
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
        env:
        - name: PORT
          value: "8006"
        - name: AVAILABILITY_SERVICE_URL
          value: "http://availability-service.travelhub.svc.cluster.local:8005"

        livenessProbe:
          httpGet:
            path: /health
            port: 8006
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8006
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /health
            port: 8006
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
