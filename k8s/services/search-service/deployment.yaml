apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: travelhub
  labels:
    app: travelhub
    component: backend
    service: search-service
    version: "1.0.5"
    managed-by: kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travelhub
      service: search-service
  template:
    metadata:
      labels:
        app: travelhub
        component: backend
        service: search-service
        version: "1.0.5"
        managed-by: kubernetes
    spec:
      containers:
      - name: search-service
        image: travelhub/search-service:1.0.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
        env:
        - name: PORT
          value: "8004"
